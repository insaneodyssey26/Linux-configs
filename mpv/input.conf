UP    add volume 2
DOWN  add volume -2
m     cycle mute

SPACE cycle pause
f     cycle fullscreen
ESC   set fullscreen no
s     stop
n     playlist-next
p     playlist-prev
e     frame-step      

RIGHT seek  5
LEFT  seek -5

SHIFT+RIGHT seek  3
SHIFT+LEFT  seek -3

ALT+RIGHT   seek  10
ALT+LEFT    seek -10

CTRL+RIGHT  seek  60
CTRL+LEFT   seek -60

CTRL+ALT+RIGHT seek  300
CTRL+ALT+LEFT  seek -300

v     cycle sub           # Cycle Subtitles
b     cycle audio         # Cycle Audio Tracks
[     add speed -0.1      # Slower
]     add speed 0.1       # Faster
=     set speed 1.0       # Reset Speed (VLC's standard)
S     screenshot          # Shift+S for Screenshot
